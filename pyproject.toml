[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "anomaly-detection-business-metrics"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pandas>=2.2,<3", "numpy>=1.26,<3", "pydantic>=2.8,<3", "python-multipart>=0.0.9", "prometheus-client>=0.20,<1", "streamlit>=1.38,<2", "requests>=2.32,<3", "plotly>=5.24,<7"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "pip-audit>=2.7,<3"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
